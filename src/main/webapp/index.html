<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión Estudiantes</title>

</head>

<body>

<h2> Consulta </h2>

<form action="consulta" method="get">
    Sentencia SQL: <input type="text" name="sql">
    <input type="submit" value="Ejecutar consulta">
</form>

<h2>Alta alumno</h2>

<form action="consulta" method="post">
    <label>ID: <input type="number" name="id"></label>
    <label>Curso: <input type="text" name="curso"></label>
    <label>Nombre: <input type="text" name="nombre"></label>

    <input type="submit" value="Alta alumno">
</form>


<h2>Informes</h2>

<form action="informe" method="post">
    <label>Formato:
        <select name="optInformes">
            <option value="application/pdf">PDF</option>
            <option value="application/vnd.ms-excel">Excel (XLS)</option>
            <option value="application/msword">Word (DOC)</option>
            <option value="text/html">HTML</option>
        </select>
    </label>
    <input type="submit" value="Generar informe">
</form>

</body>
</html>
